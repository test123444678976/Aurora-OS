name: AuroraOS - Azure VHD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vhd:
    name: Build Azure VHD
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout AuroraOS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            qemu-utils

      - name: Build AuroraOS ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify boot image
        run: |
          set -euo pipefail
          test -s aurora.iso

          python3 - <<'PY'
          with open("aurora.iso", "rb") as f:
              mbr = f.read(512)

          if len(mbr) != 512:
              raise SystemExit("Invalid boot image")

          if mbr[510:512] != b"\x55\xaa":
              raise SystemExit("MBR boot signature missing")

          print("MBR boot signature verified.")
          PY

      - name: Prepare raw disk image
        run: |
          set -euo pipefail
          mkdir -p build artifacts

          cp aurora.iso build/auroraos.raw

          SIZE=$(stat -c%s build/auroraos.raw)
          ALIGNMENT=1048576
          ALIGNED=$(( (SIZE + ALIGNMENT - 1) / ALIGNMENT * ALIGNMENT ))

          truncate -s "$ALIGNED" build/auroraos.raw
          echo "Raw image size: $ALIGNED bytes"

      - name: Convert to fixed Azure VHD
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vpc \
            -o subformat=fixed,force_size \
            build/auroraos.raw \
            artifacts/AuroraOS-Azure-Gen1.vhd

          # Specify the format explicitly: automatic probing can classify
          # a small VHD as raw even when its VHD footer is valid.
          qemu-img info -f vpc artifacts/AuroraOS-Azure-Gen1.vhd

      - name: Validate VHD
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          path = "artifacts/AuroraOS-Azure-Gen1.vhd"
          alignment = 1024 * 1024

          # Explicit -f vpc validates the VHD structure instead of relying
          # on QEMU's format auto-detection.
          info = json.loads(subprocess.check_output([
              "qemu-img", "info", "-f", "vpc", "--output=json", path
          ]))

          if info["format"] != "vpc":
              raise SystemExit(f"Expected vpc, got {info['format']}")

          size = info["virtual-size"]

          if size == 0 or size % alignment != 0:
              raise SystemExit(f"VHD virtual size is not 1 MiB aligned: {size}")

          if os.path.getsize(path) != size + 512:
              raise SystemExit("Fixed VHD must contain a 512-byte footer")

          with open(path, "rb") as image:
              image.seek(-512, os.SEEK_END)
              footer = image.read(512)

          if footer[:8] != b"conectix":
              raise SystemExit("VHD footer signature is missing")

          print("Fixed VHD structure verified.")
          print(f"Virtual size: {size} bytes")
          print(f"File size: {os.path.getsize(path)} bytes")
          PY

          cd artifacts
          sha256sum *.vhd > SHA256SUMS.txt

      - name: Upload Azure VHD
        uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-Azure-Gen1-VHD-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
